# nginx reverse proxy for Pro AutoHub.
# Install: sudo cp deploy/nginx-pro-autohub.conf /etc/nginx/sites-available/pro-autohub
#          sudo ln -s /etc/nginx/sites-available/pro-autohub /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot to add HTTPS (it rewrites this file automatically):
#          sudo certbot --nginx -d pro-autohub.com -d www.pro-autohub.com

server {
    listen 80;
    listen [::]:80;
    server_name pro-autohub.com www.pro-autohub.com;

    # Allow admin photo uploads (MAX_UPLOAD_BYTES = 5 MB; give headroom).
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Long-cache Next.js immutable build assets.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
